<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BASE GYM24 V13 Floor Map Preview</title>
<style>html,body{margin:0;background:#06080b;color:#fff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading strong{display:block;font-size:22px;margin-bottom:8px}.loading span{color:#aeb7c5;font-size:13px}.error{color:#ffb4b4}</style>
</head>
<body>
<div class="loading" id="loading"><div><strong>BASE GYM24</strong><span>100坪超・店内マップ版を読み込んでいます…</span></div></div>
<script>
(async()=>{
  try{
    let html=await fetch('./index.html?rev=v13-floor-map',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('index');return r.text()});

    const css=`
/* ===== Ver.13 100坪超 / FLOOR MAP ===== */
.floor-map-section{position:relative;overflow:hidden;background:linear-gradient(180deg,#080b10 0%,#05070a 100%)}
.floor-map-section:before{content:"";position:absolute;width:42rem;height:42rem;right:-18rem;top:-20rem;border-radius:50%;background:radial-gradient(circle,rgba(47,111,255,.16),transparent 68%);pointer-events:none}
.floor-map-head{display:grid;grid-template-columns:.82fr 1.18fr;gap:58px;align-items:end;margin-bottom:38px}
.floor-map-titlemark{max-width:560px;height:auto;object-fit:contain;object-position:left center;filter:invert(1);opacity:.96}
.floor-map-copy h2{font-size:clamp(36px,5.2vw,68px);margin:0 0 16px;line-height:1.04}
.floor-map-copy p{margin:0;color:var(--sub);font-size:14px;line-height:1.9;max-width:660px}
.floor-map-card{position:relative;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#f4f5f7;box-shadow:0 28px 80px rgba(0,0,0,.28)}
.floor-map-card img{display:block;width:100%;height:auto;object-fit:contain}
.floor-map-zones{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:15px}
.floor-map-zone{padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.floor-map-zone small{display:block;color:var(--blue2);font-size:8px;font-weight:900;letter-spacing:.12em;margin-bottom:5px}
.floor-map-zone strong{font-size:11px;line-height:1.45}
.floor-map-cta{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:28px;padding:22px 24px;border:1px solid rgba(124,164,255,.27);border-radius:16px;background:linear-gradient(120deg,rgba(47,111,255,.12),rgba(255,255,255,.02))}
.floor-map-cta p{margin:0;color:#dce4f0;font-size:13px;line-height:1.7}
.floor-map-cta .btn{white-space:nowrap;flex:none}
@media(max-width:900px){.floor-map-head{grid-template-columns:1fr;gap:24px}.floor-map-titlemark{max-width:470px}.floor-map-zones{grid-template-columns:repeat(2,1fr)}.floor-map-zone:last-child{grid-column:1/3}.floor-map-cta{align-items:flex-start;flex-direction:column}.floor-map-cta .btn{width:100%}}
@media(max-width:680px){.floor-map-head{margin-bottom:24px}.floor-map-titlemark{max-width:100%}.floor-map-copy h2{font-size:clamp(31px,10vw,44px)}.floor-map-copy p{font-size:12.5px;line-height:1.78}.floor-map-card{padding:10px;border-radius:15px}.floor-map-zones{gap:7px;margin-top:10px}.floor-map-zone{padding:11px 10px}.floor-map-zone strong{font-size:10px}.floor-map-cta{margin-top:18px;padding:18px}.floor-map-cta p{font-size:12px}}
`;

    const section=`
<section class="section floor-map-section" id="floor-map">
  <div class="wrap">
    <div class="floor-map-head">
      <div>
        <div class="kicker">100+ TSUBO / 5 TRAINING AREAS</div>
        <img class="floor-map-titlemark" src="https://himitsu-kichi24.com/assets/images/machine_ttl.png" alt="広さ100坪超え 目的別に分かれた5つのトレーニングエリア">
      </div>
      <div class="floor-map-copy">
        <h2>広いだけじゃない。<br><span class="blue">目的別に使いやすい。</span></h2>
        <p>100坪を超える店内を、5つのトレーニングエリアに分けています。やりたいトレーニングへ迷わず移動でき、初心者から経験者まで自分の目的に合わせて使いやすいレイアウトです。</p>
      </div>
    </div>

    <div class="floor-map-card">
      <img src="https://himitsu-kichi24.com/assets/images/machine_map.png" alt="BASE GYM24 店内マップ 5つのトレーニングエリア" loading="lazy">
    </div>

    <div class="floor-map-zones">
      <div class="floor-map-zone"><small>01 / CARDIO</small><strong>有酸素マシンエリア</strong></div>
      <div class="floor-map-zone"><small>02 / WEIGHT STACK</small><strong>ウェイトスタックマシンエリア</strong></div>
      <div class="floor-map-zone"><small>03 / FREE WEIGHT</small><strong>フリーウェイトエリア</strong></div>
      <div class="floor-map-zone"><small>04 / PLATE LOADED</small><strong>プレートロードマシンエリア</strong></div>
      <div class="floor-map-zone"><small>05 / STRETCH</small><strong>ストレッチエリア</strong></div>
    </div>

    <div class="floor-map-cta">
      <p><strong>実際の広さ・設備を見てから決めたい方へ。</strong><br>無料見学で、店内の雰囲気とマシンを確認できます。</p>
      <a class="btn btn-primary" href="https://himitsu-kichi.hacomono.jp/widgets/1?isFilterableByCategory=false&isShowStudioInfo=true&studioIds=1" target="_blank">無料見学を予約する →</a>
    </div>
  </div>
</section>
`;

    html=html.replace('</style>',css+'\n</style>');
    const galleryMarker='<section class="section photo-section" id="gallery">';
    if(!html.includes(galleryMarker)) throw new Error('gallery marker');
    html=html.replace(galleryMarker,section+'\n'+galleryMarker);
    html=html.replace('<title>BASE GYM24｜本厚木の24時間ジム</title>','<title>BASE GYM24｜100坪超・店内マップ Preview</title>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="error"><strong>読み込みに失敗しました</strong><span>ページを再読み込みしてください。</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
