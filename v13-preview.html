<!doctype html>
<html lang="ja">
<head>

<title>BASE GYM24｜V13 Full LP + Campaign Preview</title>
<style>
html,body{margin:0;background:#06080b;color:#fff;font-family:Inter,"Noto Sans JP","Yu Gothic",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}a{text-decoration:none;color:inherit}.wrap{width:min(calc(100% - 32px),1220px);margin:auto}
.campaign-strong{position:relative;overflow:hidden;padding:50px 0;border-top:1px solid rgba(255,199,102,.32);border-bottom:1px solid rgba(255,199,102,.32);background:radial-gradient(circle at 88% 12%,rgba(255,188,67,.26),transparent 22rem),linear-gradient(135deg,#1b1206 0%,#0d0905 48%,#171006 100%)}
.campaign-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:42px;align-items:center}.deadline{display:flex;align-items:center;gap:14px;margin-bottom:14px}.until{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;background:#ffc766;color:#171008;font-size:10px;font-weight:1000;letter-spacing:.08em}.date{font-size:clamp(48px,7vw,82px);line-height:.85;font-weight:1000;letter-spacing:-.06em;color:#ffc766}.date small{font-size:12px;letter-spacing:.04em;margin-left:8px;color:#ffe7b7}.campaign-strong h2{margin:0;font-size:clamp(40px,6vw,74px);line-height:.98;letter-spacing:-.05em}.campaign-strong h2 span{color:#ffc766}.campaign-strong p{margin:15px 0 0;color:#cbbb96;font-size:13px;line-height:1.8;max-width:620px}.benefits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.benefit{padding:17px 12px;border:1px solid rgba(255,199,102,.3);border-radius:14px;background:linear-gradient(145deg,rgba(255,184,74,.13),rgba(255,255,255,.025))}.benefit b{display:block;color:#e6bd6a;font-size:8px;letter-spacing:.1em;margin-bottom:7px}.benefit strong{display:block;color:#fff3d6;font-size:13px;line-height:1.35}.benefit em{display:block;color:#ffc766;font-style:normal;font-size:20px;margin-top:4px}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{min-height:50px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-size:12px;font-weight:900}.btn.gold{background:linear-gradient(90deg,#d99418,#ffbd48);color:#171008}.btn.ghost{border:1px solid rgba(255,199,102,.38);color:#ffe7b7;background:rgba(255,184,74,.06)}
.frame-wrap{background:#06080b}.frame-wrap iframe{display:block;width:100%;border:0;min-height:1200px;background:#06080b}
@media(max-width:900px){.campaign-grid{grid-template-columns:1fr;gap:24px}.benefits{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.campaign-strong{padding:34px 0}.date{font-size:52px}.date small{display:block;margin:6px 0 0}.campaign-strong h2{font-size:clamp(36px,12vw,50px)}.benefits{grid-template-columns:1fr 1fr}.benefit:last-child{grid-column:1/-1}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body>

          <a class="btn gold" href="https://himitsu-kichi.hacomono.jp/widgets/1?isFilterableByCategory=false&isShowStudioInfo=true&studioIds=1" target="_blank" rel="noopener">無料見学を予約 →</a>
          <a class="btn ghost" href="https://himitsu-kichi.hacomono.jp/home" target="_blank" rel="noopener">WEB入会へ</a>
        </div>
      </div>
      <div class="benefits">
        <div class="benefit"><b>BENEFIT 01</b><strong>初月・翌月<em>0円</em></strong></div>
        <div class="benefit"><b>BENEFIT 02</b><strong>入会金<em>0円</em></strong></div>
        <div class="benefit"><b>BENEFIT 03</b><strong>5か月間<em>2,200円引き</em></strong></div>
        <div class="benefit"><b>BENEFIT 04</b><strong>水素水・サプリ<em>2ヶ月無料</em></strong></div>
        <div class="benefit"><b>BENEFIT 05</b><strong>オリジナル<em>シェイカー</em></strong></div>
      </div>
    </div>
  </div>
</section>
<div class="frame-wrap">
  <iframe id="baseLp" src="./index.html?v=full-preserve" title="BASE GYM24 full LP"></iframe>
</div>
<script>
const f=document.getElementById('baseLp');
function resizeFrame(){try{const d=f.contentDocument||f.contentWindow.document;const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h>0)f.style.height=h+'px'}catch(e){}}
f.addEventListener('load',()=>{resizeFrame();setTimeout(resizeFrame,500);setTimeout(resizeFrame,1500)});
window.addEventListener('resize',()=>setTimeout(resizeFrame,100));
</script>
</body>
</html>
