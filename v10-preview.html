<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BASE GYM24 V10 Preview</title>
<style>
html,body{margin:0;background:#06080b;color:#fff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading strong{display:block;font-size:22px;margin-bottom:8px}.loading span{color:#aeb7c5;font-size:13px}.error{color:#ffb4b4}
</style>
</head>
<body>
<div class="loading" id="loading"><div><strong>BASE GYM24</strong><span>プレビューを読み込んでいます…</span></div></div>
<script>
(async()=>{
  try{
    const [v8Text,v7Text]=await Promise.all([
      fetch('./v8-preview.html?rev=10',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('V8');return r.text()}),
      fetch('./index-v7-backup.html?rev=10',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('V7');return r.text()})
    ]);
    const parser=new DOMParser();
    const v8=parser.parseFromString(v8Text,'text/html');
    const v7=parser.parseFromString(v7Text,'text/html');

    /* Preserve V7 personal training section */
    const current=v8.querySelector('#personal');
    const previous=v7.querySelector('#personal');
    if(!current||!previous)throw new Error('PERSONAL');
    current.replaceWith(previous.cloneNode(true));

    /* August campaign — place high on page after facts */
    const campaign=v8.createElement('section');
    campaign.className='section august-campaign';
    campaign.id='campaign';
    campaign.innerHTML=`
      <div class="wrap">
        <div class="campaign-top">
          <div>
            <div class="campaign-eyebrow">SUMMER MEMBERSHIP CAMPAIGN</div>
            <h2>8月限定。<br><span>今だけの5大入会特典。</span></h2>
            <p>この夏、トレーニングを始める方を応援。体験当日のご入会で使える特典を含む、期間限定キャンペーンです。</p>
          </div>
          <div class="campaign-deadline"><small>期間限定</small><strong>8.31</strong><span>月曜まで</span></div>
        </div>
        <div class="campaign-grid">
          <article class="campaign-card"><div class="campaign-no">特典 <b>1</b></div><div class="campaign-cond">体験当日のご入会で</div><small>初月月会費</small><strong>0<span>円</span></strong><p>今ならお得にスタート！</p></article>
          <article class="campaign-card"><div class="campaign-no">特典 <b>2</b></div><div class="campaign-cond">体験当日のご入会で</div><small>2ヶ月目月会費</small><strong>50<span>%OFF</span></strong><p>続けやすい料金で理想の自分へ。</p></article>
          <article class="campaign-card"><div class="campaign-no">特典 <b>3</b></div><div class="campaign-cond ghost">LIMITED BENEFIT</div><small>入会金</small><strong>0<span>円</span></strong><p>今なら入会金が無料！</p></article>
          <article class="campaign-card"><div class="campaign-no">特典 <b>4</b></div><div class="campaign-cond">体験当日のご入会で</div><small>プロテイン</small><strong class="gift">1杯<span>無料券</span></strong><p>プレゼント！</p></article>
          <article class="campaign-card"><div class="campaign-no">特典 <b>5</b></div><div class="campaign-cond">体験当日のご入会で</div><small>水素水</small><strong class="gift">2ヶ月<span>無料</span></strong><p>プレゼント！</p></article>
        </div>
        <div class="campaign-bottom">
          <p>※一部プランはキャンペーン対象外です。適用条件・対象プランの詳細は入会時の案内をご確認ください。</p>
          <div class="campaign-actions"><a class="btn btn-primary" href="https://himitsu-kichi.hacomono.jp/widgets/1?isFilterableByCategory=false&isShowStudioInfo=true&studioIds=1" target="_blank" rel="noopener">無料見学を予約 →</a><a class="btn btn-white" href="https://himitsu-kichi.hacomono.jp/home" target="_blank" rel="noopener">WEB入会へ</a></div>
        </div>
      </div>`;
    const facts=v8.querySelector('.facts')?.closest('.factbar,section,div');
    const hero=v8.querySelector('.hero');
    if(facts && facts.parentNode){facts.parentNode.insertBefore(campaign,facts.nextSibling);}else if(hero&&hero.parentNode){hero.parentNode.insertBefore(campaign,hero.nextSibling);}else{v8.body.insertBefore(campaign,v8.body.firstChild);}
    /* Add a compact campaign chip to hero */
    const heroInner=v8.querySelector('.hero-inner');
    if(heroInner){
      const chip=v8.createElement('a');
      chip.className='campaign-chip';
      chip.href='#campaign';
      chip.innerHTML='<b>8.31まで</b><span>5大入会特典 実施中</span><i>→</i>';
      const eyebrow=heroInner.querySelector('.eyebrow');
      if(eyebrow)eyebrow.insertAdjacentElement('afterend',chip); else heroInner.prepend(chip);
    }

    const style=v8.createElement('style');
    style.textContent=`
/* V10 AUGUST CAMPAIGN */
.august-campaign{position:relative;overflow:hidden;background:radial-gradient(circle at 86% 4%,rgba(47,111,255,.25),transparent 26rem),linear-gradient(180deg,#0b111b 0%,#06080b 100%)}
.august-campaign:before{content:"08";position:absolute;right:-.02em;top:-.18em;font-size:min(35vw,480px);font-weight:1000;line-height:1;color:rgba(255,255,255,.018);pointer-events:none}
.campaign-top{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:50px;align-items:end;margin-bottom:38px}
.campaign-eyebrow{font-size:10px;letter-spacing:.22em;font-weight:950;color:#7ca4ff;margin-bottom:12px}
.campaign-top h2{margin-bottom:15px}.campaign-top h2 span{color:#7ca4ff}.campaign-top p{max-width:720px;color:#aeb7c5;font-size:14px;line-height:1.9;margin:0}
.campaign-deadline{width:170px;height:170px;border-radius:50%;border:1px solid rgba(124,164,255,.48);background:rgba(47,111,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(47,111,255,.12)}
.campaign-deadline small{font-size:9px;letter-spacing:.18em;font-weight:950;color:#bcd0ff}.campaign-deadline strong{font-size:48px;line-height:1;margin:7px 0 4px;letter-spacing:-.05em}.campaign-deadline span{font-size:11px;font-weight:900;color:#dce6ff}
.campaign-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.campaign-card{min-width:0;padding:22px 18px 24px;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 20px 60px rgba(0,0,0,.16)}
.campaign-no{font-size:10px;font-weight:900;letter-spacing:.12em;color:#cbd2dd;margin-bottom:18px}.campaign-no b{font-size:20px;color:#7ca4ff;margin-left:3px}.campaign-cond{display:inline-flex;min-height:24px;align-items:center;padding:0 8px;border-radius:999px;background:#2f6fff;color:#fff;font-size:8px;font-weight:900;margin-bottom:17px;white-space:nowrap}.campaign-cond.ghost{background:rgba(47,111,255,.12);color:#9fbbff;border:1px solid rgba(124,164,255,.22)}
.campaign-card>small{display:block;color:#d7dde7;font-size:11px;font-weight:900}.campaign-card>strong{display:block;font-size:50px;line-height:1;color:#7ca4ff;letter-spacing:-.06em;margin:8px 0 12px;white-space:nowrap}.campaign-card>strong span{font-size:16px;letter-spacing:-.02em;margin-left:2px}.campaign-card>strong.gift{font-size:39px}.campaign-card>strong.gift span{display:block;font-size:21px;margin:5px 0 0;letter-spacing:-.02em}.campaign-card>p{margin:0;color:#aeb7c5;font-size:10.5px;line-height:1.65}
.campaign-bottom{position:relative;z-index:1;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-between;align-items:center;gap:24px}.campaign-bottom>p{margin:0;max-width:650px;color:#7f8a9b;font-size:10px;line-height:1.7}.campaign-actions{display:flex;gap:8px;flex-shrink:0}
.campaign-chip{display:inline-flex;align-items:center;gap:10px;margin:0 0 18px;padding:8px 12px 8px 9px;border:1px solid rgba(124,164,255,.36);border-radius:999px;background:rgba(47,111,255,.13);backdrop-filter:blur(8px);font-size:10px;font-weight:900}.campaign-chip b{background:#2f6fff;border-radius:999px;padding:5px 8px;font-size:9px}.campaign-chip span{color:#e7edff}.campaign-chip i{font-style:normal;color:#7ca4ff}
@media(max-width:1050px){.campaign-grid{grid-template-columns:repeat(3,1fr)}.campaign-card:nth-child(4),.campaign-card:nth-child(5){grid-column:span 1}}
@media(max-width:760px){.campaign-top{grid-template-columns:1fr;gap:22px}.campaign-deadline{width:auto;height:auto;border-radius:16px;display:grid;grid-template-columns:auto auto auto;gap:8px;justify-content:start;padding:16px 18px}.campaign-deadline strong{font-size:32px;margin:0}.campaign-grid{grid-template-columns:1fr 1fr}.campaign-card:last-child{grid-column:1/-1}.campaign-bottom{display:block}.campaign-actions{margin-top:18px}.campaign-actions .btn{flex:1;padding:0 13px}.campaign-card>strong{font-size:44px}}
@media(max-width:480px){.campaign-grid{grid-template-columns:1fr}.campaign-card:last-child{grid-column:auto}.campaign-card{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:center}.campaign-no,.campaign-cond,.campaign-card>small,.campaign-card>p{grid-column:1}.campaign-card>strong{grid-column:2;grid-row:2/5;margin:0;text-align:right}.campaign-card>strong.gift span{display:inline;font-size:15px}.campaign-actions{display:grid;grid-template-columns:1fr}}

/* V7 PERSONAL TRAINING SECTION — intentionally preserved */
#personal .personal{border:1px solid var(--line);border-radius:28px;padding:0;overflow:hidden;background:linear-gradient(145deg,#111722 0%,#090c11 48%,#07090d 100%);box-shadow:0 24px 70px rgba(0,0,0,.18)}
#personal .pt-intro{padding:74px 68px 60px;display:grid;grid-template-columns:1fr .84fr;gap:52px;align-items:end}
#personal .pt-badge{display:inline-flex;gap:9px;align-items:center;padding:9px 12px;border:1px solid rgba(124,164,255,.32);background:rgba(47,111,255,.08);border-radius:999px;color:#dfe8ff;font-size:10px;font-weight:900;letter-spacing:.12em;margin-bottom:18px}
#personal .pt-proof{padding:24px 28px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:16px}
#personal .pt-proof strong{display:block;font-size:clamp(24px,3vw,38px);line-height:1.08;margin-bottom:10px}
#personal .pt-proof p{margin:0;color:var(--sub);font-size:12px;line-height:1.75}
#personal .trainer{display:block;margin:0;padding:0 68px 68px;border-top:0}
#personal .trainer-showcase{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;min-height:720px}
#personal .trainer-hero-photo{min-height:720px;border-radius:22px;overflow:hidden;position:relative;background:#090b0f}
#personal .trainer-hero-photo img{width:100%;height:100%;object-fit:contain!important;object-position:center center!important;background:#090b0f}
#personal .trainer-hero-photo:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:22px;pointer-events:none}
#personal .trainer-copy-stack{display:grid;grid-template-rows:auto 1fr auto;gap:18px}
#personal .trainer-card-premium{padding:34px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.027)}
#personal .trainer-label{color:var(--blue2);font-size:10px;font-weight:900;letter-spacing:.18em;margin-bottom:8px}
#personal .trainer-name-premium{font-size:clamp(34px,4vw,54px);line-height:1;font-weight:950;margin:0 0 14px}
#personal .trainer-position{font-size:12px;color:#d8dee8;margin-bottom:22px}
#personal .trainer-message{font-size:16px;line-height:1.95;color:#d5dae3;margin:0}
#personal .champion-block{position:relative;overflow:hidden;padding:34px;border-radius:22px;border:1px solid rgba(124,164,255,.27);background:radial-gradient(circle at 90% 10%,rgba(47,111,255,.22),transparent 18rem),linear-gradient(145deg,#101827,#0b1018)}
#personal .champion-block small{display:block;font-size:10px;font-weight:900;letter-spacing:.18em;color:#bcd0ff;margin-bottom:12px}
#personal .champion-block .big{display:block;font-size:clamp(30px,4.4vw,58px);line-height:1.03;font-weight:1000;letter-spacing:-.035em}
#personal .champion-block .jp{display:block;margin-top:15px;font-size:15px;font-weight:800}
#personal .results-premium{display:grid;gap:0;border:1px solid var(--line);border-radius:22px;overflow:hidden}
#personal .result-premium{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:18px 20px;background:rgba(255,255,255,.018);border-bottom:1px solid var(--line)}
#personal .result-premium:last-child{border-bottom:0}
#personal .result-premium .year{color:var(--blue2);font-weight:950;font-size:13px}
#personal .result-premium .event{font-size:12px;line-height:1.5;color:#dce2eb;font-weight:750}
#personal .result-premium .rank{font-size:12px;font-weight:950;color:#fff;white-space:nowrap}
#personal .secondary-photo{margin-top:18px;display:grid;grid-template-columns:.84fr 1.16fr;gap:18px}
#personal .secondary-photo-visual{min-height:410px;border-radius:22px;overflow:hidden;background:#090b0f;border:1px solid var(--line)}
#personal .secondary-photo-visual img{width:100%;height:100%;object-fit:contain!important;object-position:center center!important;background:#090b0f}
#personal .secondary-copy{display:flex;flex-direction:column;justify-content:center;padding:42px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.022)}
#personal .secondary-copy h3{font-size:clamp(28px,3.3vw,43px);line-height:1.15;margin-bottom:18px}
#personal .secondary-copy p{color:var(--sub);font-size:14px;line-height:1.9;margin:0}
#personal .ptprices{display:grid;grid-template-columns:1fr 1fr;margin:0;padding:0 68px 68px;gap:16px}
#personal .ptprice{padding:28px 30px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025)}
#personal .ptprice small{font-size:10px;color:var(--muted)}
#personal .ptprice strong{display:block;font-size:24px;margin:8px 0}
#personal .ptprice p{margin:0;color:var(--sub);font-size:12px;line-height:1.7}
#personal .personal-head,#personal .targets,#personal .personal>.trainer-card{display:none!important}
@media(max-width:1000px){#personal .pt-intro,#personal .trainer-showcase,#personal .secondary-photo{grid-template-columns:1fr}#personal .trainer-hero-photo{min-height:640px}#personal .trainer{padding:0 36px 42px}#personal .pt-intro{padding:52px 36px 42px}#personal .ptprices{padding:0 36px 46px}}
@media(max-width:680px){#personal .personal{border-radius:20px}#personal .pt-intro{padding:36px 20px 28px;gap:28px}#personal .trainer{padding:0 20px 34px}#personal .trainer-showcase{min-height:0}#personal .trainer-hero-photo{min-height:0;aspect-ratio:3/4}#personal .trainer-card-premium,#personal .champion-block{padding:24px 20px}#personal .result-premium{grid-template-columns:52px 1fr;gap:8px 12px}#personal .result-premium .rank{grid-column:2}#personal .secondary-photo-visual{min-height:0;aspect-ratio:1.19/1}#personal .secondary-copy{padding:28px 22px}#personal .ptprices{grid-template-columns:1fr;padding:0 20px 34px}}
`;
    v8.head.appendChild(style);
    v8.title='BASE GYM24｜V10 August Campaign Preview';
    const robots=v8.querySelector('meta[name="robots"]');
    if(robots)robots.setAttribute('content','noindex,nofollow');
    document.open();
    document.write('<!doctype html>'+v8.documentElement.outerHTML);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div class="error"><strong>読み込みに失敗しました</strong><span>ページを再読み込みしてください。</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
