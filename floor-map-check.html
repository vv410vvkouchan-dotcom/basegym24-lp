<!doctype html>
<html lang="ja">
<head>

<style>html,body{margin:0;background:#06080b;color:#fff;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading span{color:#aeb7c5;font-size:13px}.error{color:#ffb4b4}</style>
</head>
<body>

<script>
(async()=>{
try{
let html=await fetch('https://raw.githubusercontent.com/vv410vvkouchan-dotcom/basegym24-lp/v12-lock-20260810/v10-preview.html?rev=floormapcheck2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('V10 '+r.status);return r.text()});
html=html
.replaceAll('./v8-preview.html?rev=10','https://raw.githubusercontent.com/vv410vvkouchan-dotcom/basegym24-lp/v12-lock-20260810/v8-preview.html?rev=floormapcheck2')
.replaceAll('./index.html?rev=10','https://raw.githubusercontent.com/vv410vvkouchan-dotcom/basegym24-lp/v12-lock-20260810/index.html?rev=floormapcheck2')
.replace('SUMMER MEMBERSHIP CAMPAIGN','8月入会キャンペーン')
.replace('<small>初月月会費</small><strong>0<span>円</span></strong><p>今ならお得にスタート！</p>','<small>初月・翌月の月会費</small><strong>0<span>円</span></strong><p>最初の2か月分の月会費が無料。</p>')
.replace('<small>2ヶ月目月会費</small><strong>50<span>%OFF</span></strong><p>続けやすい料金で理想の自分へ。</p>','<small>入会金</small><strong>0<span>円</span></strong><p>今なら入会金が無料。</p>')
.replace('<small>入会金</small><strong>0<span>円</span></strong><p>今なら入会金が無料！</p>','<small>入会から5か月間の月会費</small><strong class="gift">2,200<span>円引き</span></strong><p>5か月間、お得な月会費で続けられます。</p>')
.replace('<small>プロテイン</small><strong class="gift">1杯<span>無料券</span></strong><p>プレゼント！</p>','<small>水素水・サプリメントサーバー</small><strong class="gift">2ヶ月<span>無料</span></strong><p>水分・栄養補給をサポート。</p>')
.replace('<small>水素水</small><strong class="gift">2ヶ月<span>無料</span></strong><p>プレゼント！</p>','<small>オリジナル</small><strong class="gift">シェイカー<span>プレゼント</span></strong><p>入会特典としてプレゼント。</p>')
.replace('この夏、トレーニングを始める方を応援。体験当日のご入会で使える特典を含む、期間限定キャンペーンです。','この夏、トレーニングを始める方を応援。初月・翌月会費無料、入会金無料、さらに5か月間の月会費割引など、8月限定の入会キャンペーンです。')
.replaceAll('LIMITED BENEFIT','期間限定').replaceAll('PRESENT','入会特典')
.replace('継続条件・違約金は契約画面でご確認ください。','入会月を除き6ヶ月の継続条件があります。');

const runtime=`
/* FLOOR MAP START */
const fmStyle=v8.createElement('style');
fmStyle.textContent=\`
.floor-map-section{position:relative;overflow:hidden;background:linear-gradient(180deg,#080b10,#05070a)}
.floor-map-head{display:grid;grid-template-columns:.82fr 1.18fr;gap:58px;align-items:end;margin-bottom:38px}
.floor-map-titlemark{display:block;width:100%;max-width:560px;height:auto!important;object-fit:contain!important;filter:invert(1)}
.floor-map-copy h2{font-size:clamp(36px,5.2vw,68px);margin:0 0 16px;line-height:1.04}.floor-map-copy p{margin:0;color:var(--sub);font-size:14px;line-height:1.9;max-width:660px}
.floor-map-card{padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#f4f5f7;box-shadow:0 28px 80px rgba(0,0,0,.28)}.floor-map-card img{display:block;width:100%;height:auto!important;object-fit:contain!important}
.floor-map-zones{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:15px}.floor-map-zone{padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.floor-map-zone small{display:block;color:var(--blue2);font-size:8px;font-weight:900;letter-spacing:.12em;margin-bottom:5px}.floor-map-zone strong{font-size:11px;line-height:1.45}
.floor-map-cta{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:28px;padding:22px 24px;border:1px solid rgba(124,164,255,.27);border-radius:16px;background:linear-gradient(120deg,rgba(47,111,255,.12),rgba(255,255,255,.02))}.floor-map-cta p{margin:0;color:#dce4f0;font-size:13px;line-height:1.7}
@media(max-width:900px){.floor-map-head{grid-template-columns:1fr;gap:24px}.floor-map-zones{grid-template-columns:repeat(2,1fr)}.floor-map-zone:last-child{grid-column:1/3}.floor-map-cta{flex-direction:column;align-items:flex-start}.floor-map-cta .btn{width:100%}}
@media(max-width:680px){.floor-map-card{padding:10px;border-radius:15px}.floor-map-copy h2{font-size:clamp(31px,10vw,44px)}.floor-map-copy p{font-size:12.5px}.floor-map-head{gap:24px;margin-bottom:24px}}
\`;
v8.head.appendChild(fmStyle);
const fm=v8.createElement('section');fm.className='section floor-map-section';fm.id='floor-map';
fm.innerHTML=\`<div class="wrap"><div class="floor-map-head"><div><div class="kicker">100+ TSUBO / 5 TRAINING AREAS</div><img class="floor-map-titlemark" src="https://himitsu-kichi24.com/assets/images/machine_ttl.png" alt="広さ100坪超え 目的別に分かれた5つのトレーニングエリア"></div><div class="floor-map-copy"><h2>広いだけじゃない。<br><span class="blue">目的別に使いやすい。</span></h2><p>100坪を超える店内を、5つのトレーニングエリアに分けています。初心者から経験者まで、目的に合わせて使いやすいレイアウトです。</p></div></div><div class="floor-map-card"><img src="https://himitsu-kichi24.com/assets/images/machine_map.png" alt="BASE GYM24 店内マップ" loading="lazy"></div><div class="floor-map-zones"><div class="floor-map-zone"><small>01 / CARDIO</small><strong>有酸素マシンエリア</strong></div><div class="floor-map-zone"><small>02 / WEIGHT STACK</small><strong>ウェイトスタックマシンエリア</strong></div><div class="floor-map-zone"><small>03 / FREE WEIGHT</small><strong>フリーウェイトエリア</strong></div><div class="floor-map-zone"><small>04 / PLATE LOADED</small><strong>プレートロードマシンエリア</strong></div><div class="floor-map-zone"><small>05 / STRETCH</small><strong>ストレッチエリア</strong></div></div><div class="floor-map-cta"><p><strong>実際の広さ・設備を見てから決めたい方へ。</strong><br>無料見学で、店内の雰囲気とマシンを確認できます。</p><a class="btn btn-primary" href="https://himitsu-kichi.hacomono.jp/widgets/1?isFilterableByCategory=false&isShowStudioInfo=true&studioIds=1" target="_blank" rel="noopener">無料見学を予約する →</a></div></div>\`;
const gallery=v8.querySelector('#gallery');const facility=v8.querySelector('#facility');if(gallery&&gallery.parentNode)gallery.parentNode.insertBefore(fm,gallery);else if(facility&&facility.parentNode)facility.parentNode.insertBefore(fm,facility.nextSibling);else v8.body.appendChild(fm);
/* FLOOR MAP END */`;
html=html.replace('    v8.head.appendChild(style);','    v8.head.appendChild(style);\n'+runtime);
html=html.replace("v8.title='BASE GYM24｜V10 August Campaign Preview';","v8.title='BASE GYM24｜図面追加確認';");
document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').innerHTML='<div class="error"><strong>読み込みに失敗しました</strong><br><span>'+String(e)+'</span></div>';console.error(e)}
})();
</script>
</body>
</html>
